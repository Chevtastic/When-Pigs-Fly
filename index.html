<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>When Pigs Fly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="menu" class="overlay">
      <div class="panel">
        <h1>When Pigs Fly</h1>
        <p class="tag">Dodge the farm. Reach the mud. Don't become breakfast.</p>
        <div id="levels"></div>
        <div class="controls">
          <span><kbd>Space</kbd> hold to fly up</span>
          <span><kbd>Shift</kbd> hold to go faster</span>
          <span><kbd>P</kbd> pause</span>
          <span><kbd>R</kbd> restart</span>
          <span><kbd>M</kbd> mute</span>
        </div>
        <p class="hint">Press <kbd>Space</kbd> to start</p>
      </div>
    </div>

    <div id="win" class="overlay hidden">
      <div class="panel">
        <h2 id="winTitle">Made it to the mud!</h2>
        <p id="winStats"></p>
        <div class="btns">
          <button id="nextBtn" class="primary">Next level</button>
          <button id="replayBtn">Replay</button>
          <button id="menuBtn">Menu</button>
        </div>
      </div>
    </div>

    <div id="pause" class="overlay hidden">
      <div class="panel">
        <h2>Paused</h2>
        <p>Press <kbd>P</kbd> to keep flying</p>
        <div class="btns">
          <button id="resumeBtn" class="primary">Resume</button>
          <button id="quitBtn">Quit to menu</button>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
